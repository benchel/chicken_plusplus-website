<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>치킨플러스플러스 | Sign in </title>
    <link rel="stylesheet" href="./style/output.css"/>
    <link rel="stylesheet" href="./style/common/reset.css"/>
    <link rel="stylesheet" href="./style/common/layout.css"/>
    <link rel="stylesheet" href="./style/sign_in.css"/>
    <script src="./js/header_ctrl.js"></script>
</head>
<body>
    <div class="site-container">
        <main>
            <!-- 각자 작업물이 들어갈 부분 -->
            <div class="signin_container">
                <div class="log-container">
                    <div class="logo font-Myanmar_Khyay">
                        <a href="./index.html" aria-label="치킨플러스플러스 로고(홈으로 이동)">
                            <h2>C++</h2>
                            <span>치킨플러스플러스</span>
                        </a>
                    </div>
                </div>
                <div class="signin_box">
                    <input type="text" name="user_id" class="user_id" placeholder="아이디"/>
                    <input type="password" name="pwd" class="user_pwd" placeholder="비밀번호"/>
                    <button type="button">로그인</button>
                    <div class="box_bottom">
                        <span><a href="./register.html">회원가입</a></span>
                        <ul>
                            <li>아이디 찾기</li>
                            <li>|</li>
                            <li>비밀번호 찾기</li>
                        </ul>
                    </div>
                </div>
                <div class="conditions_box">
                    <span>이용약관</span>
                    <span>개인정보처리방침</span>
                </div>         
            </div>
        </main>
    </div>
</body>
</html>
